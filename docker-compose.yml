services:
  memory-journal-mcp:
    build: .
    container_name: memory-journal-mcp
    volumes:
      - ./data:/app/data:rw,noexec,nosuid,nodev
    environment:
      - MEMORY_JOURNAL_CONFIG=
      - DB_PATH=/app/data/memory_journal.db
      - TEAM_DB_PATH=
      - ADDITIONAL_TEAM_DBS=
      - TEAM_DEFAULT_ROLE=
      - TEAM_ADMIN=
      - DEFAULT_PROJECT_NUMBER=
      - DEFAULT_WORKSPACE_ID=
      - EMBEDDING_MODEL=
      - AUTO_REBUILD_INDEX=
      - MCP_HOST=
      - PORT=
      - STATELESS=
      - CORS_ORIGIN=
      - MCP_ENABLE_HSTS=
      - MCP_AUTH_TOKEN=
      - MCP_AUTH_SCOPES=
      - TRUST_PROXY=
      - PUBLIC_ORIGIN=
      - OAUTH_ENABLED=
      - AUDIT_LOG_PATH=stderr
      - ALLOWED_IO_ROOTS=/app/data
      - MEMORY_JOURNAL_MCP_TOOL_FILTER=
      - AUTO_PRUNE_INTERVAL_MINUTES=
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mcp-net
    stdin_open: true
    tty: true
    command: ['node', 'dist/cli.js']
    restart: unless-stopped

  memory-journal-mcp-http:
    build: .
    container_name: memory-journal-mcp-http
    volumes:
      - ./data:/app/data:rw,noexec,nosuid,nodev
    environment:
      - MEMORY_JOURNAL_CONFIG=
      - DB_PATH=/app/data/memory_journal.db
      - TEAM_DB_PATH=
      - ADDITIONAL_TEAM_DBS=
      - TEAM_DEFAULT_ROLE=
      - TEAM_ADMIN=
      - DEFAULT_PROJECT_NUMBER=
      - DEFAULT_WORKSPACE_ID=
      - EMBEDDING_MODEL=
      - AUTO_REBUILD_INDEX=
      - MCP_HOST=0.0.0.0
      - PORT=3000
      - STATELESS=
      - CORS_ORIGIN=
      - MCP_ENABLE_HSTS=
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required for HTTP transport in production}
      - MCP_AUTH_SCOPES=
      - TRUST_PROXY=
      - PUBLIC_ORIGIN=
      - OAUTH_ENABLED=
      - AUDIT_LOG_PATH=stderr
      - ALLOWED_IO_ROOTS=/app/data
      - MEMORY_JOURNAL_MCP_TOOL_FILTER=
      - AUTO_PRUNE_INTERVAL_MINUTES=
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mcp-net
    ports:
      - '3000:3000'
    command:
      ['node', 'dist/cli.js', '--transport', 'http', '--port', '3000', '--server-host', '0.0.0.0']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    profiles:
      - http

networks:
  mcp-net:
    driver: bridge
