services:
  memory-journal-mcp:
    build: .
    container_name: memory-journal-mcp
    volumes:
      - ./data:/app/data:rw,noexec,nosuid,nodev
    environment:
      - DB_PATH=/app/data/memory_journal.db
      # - TEST_DB_PATH=
      - DB_ENCRYPTION_KEY=
      - TEAM_DB_PATH=
      # - TEST_TEAM_DB_PATH=
      - ADDITIONAL_TEAM_DBS=
      - TEAM_AUTHOR=
      - TEAM_DEFAULT_ROLE=
      - TEAM_ADMIN=
      - GITHUB_TOKEN=
      - DEFAULT_PROJECT_NUMBER=
      - PROJECT_REGISTRY=
      # - MCP_WORKSPACE_ID=
      # Tool filtering naming conventions: MEMORY_JOURNAL_MCP_TOOL_FILTER (env var), "toolFilter" (memory-journal.config.yaml — supports .yaml/.yml/.json), --tool-filter (CLI flag), tool_filter (update_configuration MCP tool). Note: TOOL_FILTER is a display-only fallback and does not activate startup filtering.
      - MEMORY_JOURNAL_MCP_TOOL_FILTER=
      - CODE_MODE_MAX_RESULT_SIZE=
      - CODEMODE_INTERNAL_FULL_ACCESS=
      - ALLOWED_IO_ROOTS=/app/data
      - MCP_AGENT_HEALING=true
      # - DISABLE_ISSUE_LOGGING=false
      - MAX_TOOL_INPUT_ELEMENTS=25000
      - NODE_ENV=
      - DEBUG=
      - MEMORY_JOURNAL_CONFIG=
      - MCP_HOST=
      - PORT=
      - TRANSPORT=
      - STATELESS=
      - MCP_AUTH_TOKEN=
      - MCP_AUTH_SCOPES=
      - CORS_ORIGIN=
      - MCP_RATE_LIMIT_MAX=
      - MCP_ENABLE_HSTS=
      - LOG_LEVEL=
      - TRUST_PROXY=
      - PUBLIC_ORIGIN=
      - DEFAULT_WORKSPACE_ID=
      - OAUTH_ENABLED=
      - OAUTH_ISSUER=
      - OAUTH_AUDIENCE=
      - OAUTH_JWKS_URI=
      - OAUTH_ALLOW_PLAINTEXT_LOOPBACK=
      - OAUTH_CLOCK_TOLERANCE=
      - BRIEFING_IMPORTANCE_THRESHOLD=
      - BRIEFING_ENTRY_COUNT=
      - BRIEFING_COMMIT_COUNT=
      - BRIEFING_SUMMARY_COUNT=
      - BRIEFING_INCLUDE_TEAM=
      - BRIEFING_MILESTONE_COUNT=
      - BRIEFING_ISSUE_COUNT=
      - BRIEFING_PR_COUNT=
      - BRIEFING_PR_STATUS=
      - BRIEFING_WORKFLOW_COUNT=
      - BRIEFING_WORKFLOW_STATUS=
      - BRIEFING_COPILOT_REVIEWS=
      - STALENESS_ACTIVE_HOURS=24
      - STALENESS_RECENT_DAYS=7
      - STALENESS_STALE_DAYS=30
      - RULES_FILE_PATH=
      - SKILLS_DIR_PATH=
      - MEMORY_JOURNAL_WORKFLOW_SUMMARY=
      - AUDIT_LOG_PATH=stderr
      - AUDIT_REDACT=
      - AUDIT_READS=
      - AUDIT_LOG_MAX_SIZE=
      - PERSIST_METRICS=
      - METRICS_PATH=
      - METRICS_EXPORT=
      - MJ_METRICS_PORT=
      - MJ_METRICS_HOST=
      - BACKUP_INTERVAL=
      - KEEP_BACKUPS=
      - VACUUM_INTERVAL=
      - REBUILD_INDEX_INTERVAL=
      - DIGEST_INTERVAL=
      - REPORT_INTERVAL=
      - REPORT_WEBHOOK_URL=
      - REPORT_WEBHOOK_AUTH=
      - REPORT_CONTENT_TYPE=
      - ALLOW_INSECURE_WEBHOOK_HTTP=
      - EMBEDDING_MODEL=
      - AUTO_REBUILD_INDEX=
      - AUTO_PRUNE_INTERVAL_MINUTES=
      - ARCHIVE_OLDER_THAN_DAYS=
      - PRUNE_OLDER_THAN_DAYS=
      - HARD_DELETE_OLDER_THAN_DAYS=
      - PRUNE_IMPORTANCE_THRESHOLD=
      - PRUNE_DRY_RUN=
      - PRUNE_EXCLUDE_TAGS=
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mcp-net
    stdin_open: true
    tty: true
    command: ['node', 'dist/cli.js']
    restart: unless-stopped

  memory-journal-mcp-http:
    build: .
    container_name: memory-journal-mcp-http
    volumes:
      - ./data:/app/data:rw,noexec,nosuid,nodev
    environment:
      - DB_PATH=/app/data/memory_journal.db
      # - TEST_DB_PATH=
      - DB_ENCRYPTION_KEY=
      - TEAM_DB_PATH=
      # - TEST_TEAM_DB_PATH=
      - ADDITIONAL_TEAM_DBS=
      - TEAM_AUTHOR=
      - TEAM_DEFAULT_ROLE=
      - TEAM_ADMIN=
      - GITHUB_TOKEN=
      - DEFAULT_PROJECT_NUMBER=
      - PROJECT_REGISTRY=
      # - MCP_WORKSPACE_ID=
      # Tool filtering naming conventions: MEMORY_JOURNAL_MCP_TOOL_FILTER (env var), "toolFilter" (memory-journal.config.yaml — supports .yaml/.yml/.json), --tool-filter (CLI flag), tool_filter (update_configuration MCP tool). Note: TOOL_FILTER is a display-only fallback and does not activate startup filtering.
      - MEMORY_JOURNAL_MCP_TOOL_FILTER=
      - CODE_MODE_MAX_RESULT_SIZE=
      - CODEMODE_INTERNAL_FULL_ACCESS=
      - ALLOWED_IO_ROOTS=/app/data
      - MCP_AGENT_HEALING=true
      # - DISABLE_ISSUE_LOGGING=false
      - MAX_TOOL_INPUT_ELEMENTS=25000
      - NODE_ENV=
      - DEBUG=
      - MEMORY_JOURNAL_CONFIG=
      - MCP_HOST=0.0.0.0
      - PORT=3000
      - TRANSPORT=http
      - STATELESS=
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required for HTTP transport in production}
      - MCP_AUTH_SCOPES=
      - CORS_ORIGIN=
      - MCP_RATE_LIMIT_MAX=
      - MCP_ENABLE_HSTS=
      - LOG_LEVEL=
      - TRUST_PROXY=
      - PUBLIC_ORIGIN=
      - DEFAULT_WORKSPACE_ID=
      - OAUTH_ENABLED=
      - OAUTH_ISSUER=
      - OAUTH_AUDIENCE=
      - OAUTH_JWKS_URI=
      - OAUTH_ALLOW_PLAINTEXT_LOOPBACK=
      - OAUTH_CLOCK_TOLERANCE=
      - BRIEFING_IMPORTANCE_THRESHOLD=
      - BRIEFING_ENTRY_COUNT=
      - BRIEFING_COMMIT_COUNT=
      - BRIEFING_SUMMARY_COUNT=
      - BRIEFING_INCLUDE_TEAM=
      - BRIEFING_MILESTONE_COUNT=
      - BRIEFING_ISSUE_COUNT=
      - BRIEFING_PR_COUNT=
      - BRIEFING_PR_STATUS=
      - BRIEFING_WORKFLOW_COUNT=
      - BRIEFING_WORKFLOW_STATUS=
      - BRIEFING_COPILOT_REVIEWS=
      - STALENESS_ACTIVE_HOURS=24
      - STALENESS_RECENT_DAYS=7
      - STALENESS_STALE_DAYS=30
      - RULES_FILE_PATH=
      - SKILLS_DIR_PATH=
      - MEMORY_JOURNAL_WORKFLOW_SUMMARY=
      - AUDIT_LOG_PATH=stderr
      - AUDIT_REDACT=
      - AUDIT_READS=
      - AUDIT_LOG_MAX_SIZE=
      - PERSIST_METRICS=
      - METRICS_PATH=
      - METRICS_EXPORT=
      - MJ_METRICS_PORT=
      - MJ_METRICS_HOST=
      - BACKUP_INTERVAL=
      - KEEP_BACKUPS=
      - VACUUM_INTERVAL=
      - REBUILD_INDEX_INTERVAL=
      - DIGEST_INTERVAL=
      - REPORT_INTERVAL=
      - REPORT_WEBHOOK_URL=
      - REPORT_WEBHOOK_AUTH=
      - REPORT_CONTENT_TYPE=
      - ALLOW_INSECURE_WEBHOOK_HTTP=
      - EMBEDDING_MODEL=
      - AUTO_REBUILD_INDEX=
      - AUTO_PRUNE_INTERVAL_MINUTES=
      - ARCHIVE_OLDER_THAN_DAYS=
      - PRUNE_OLDER_THAN_DAYS=
      - HARD_DELETE_OLDER_THAN_DAYS=
      - PRUNE_IMPORTANCE_THRESHOLD=
      - PRUNE_DRY_RUN=
      - PRUNE_EXCLUDE_TAGS=
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mcp-net
    ports:
      - '3000:3000'
    command:
      ['node', 'dist/cli.js', '--transport', 'http', '--port', '3000', '--server-host', '0.0.0.0']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    profiles:
      - http

networks:
  mcp-net:
    driver: bridge
