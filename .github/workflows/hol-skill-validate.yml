name: HOL Skill Validate

on:
  push:
    branches: [main]
    paths:
      - skills/github-commander/**
      - .github/workflows/hol-skill-validate.yml
  pull_request:
    branches: [main]
    paths:
      - skills/github-commander/**
      - .github/workflows/hol-skill-validate.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: none

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HAS_API_KEY: ${{ secrets.RB_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Validate Skill
        if: ${{ env.HAS_API_KEY == 'true' }}
        uses: hashgraph-online/skill-publish@f9a1962fcbd8116e1e82bed3c97d9223a6206ac4 # v1.2
        with:
          api-key: ${{ secrets.RB_API_KEY }}
          skill-dir: skills/github-commander
          annotate: 'false'
