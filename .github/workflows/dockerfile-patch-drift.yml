name: Dockerfile Patch Drift Check

# Verifies Dockerfile security invariants (npm/npx removal in stage 2),
# package.json / pnpm-workspace.yaml override parity, and upstream npm
# registry versions for CVE overrides. Runs daily and on dependency changes.

on:
  schedule:
    - cron: "0 12 * * *" # Daily at noon UTC
  pull_request:
    paths:
      - "Dockerfile"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-overrides:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.x"

      - name: Verify Dockerfile npm removal invariant
        run: |
          echo "🔍 Verifying Dockerfile strips npm and npx from runtime stage..."
          if grep -q "rm -rf /usr/local/lib/node_modules/npm" Dockerfile; then
            echo "✅ Dockerfile removes /usr/local/lib/node_modules/npm in production stage."
          else
            echo "::error::Dockerfile no longer strips /usr/local/lib/node_modules/npm in the runtime stage."
            exit 1
          fi

      - name: Check package.json override drift
        run: |
          echo "🔍 Checking package.json overrides for drift..."
          echo ""

          # Extract overrides from package.json
          OVERRIDES=$(node -e "
            const pkg = require('./package.json');
            const overrides = pkg.overrides || {};
            for (const [name, version] of Object.entries(overrides)) {
              console.log(name + '=' + version);
            }
          ")

          while IFS='=' read -r pkg version; do
            [ -z "$pkg" ] && continue

            LATEST=$(pnpm view "$pkg" version 2>/dev/null || echo "unknown")

            if [ "$LATEST" = "$version" ]; then
              echo "✅ CURRENT: $pkg@$version — matches latest registry version"
            elif [ "$LATEST" = "unknown" ]; then
              echo "⚠️  $pkg: not found in npm registry"
            else
              echo "ℹ️  REVIEW: $pkg — override=$version, registry latest=$LATEST"
            fi
          done <<< "$OVERRIDES"

          echo ""
          echo "ℹ️  Overrides are intentional CVE patches for transitive dependencies."
          echo "   Remove an override only after confirming the parent dependency"
          echo "   has adopted the fix and pnpm audit passes without it."
