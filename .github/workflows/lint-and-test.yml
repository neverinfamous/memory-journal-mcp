name: Lint and Test

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || (echo "Retrying in 5s..." && sleep 5 && pnpm install --frozen-lockfile) || (echo "Retrying in 10s..." && sleep 10 && pnpm install --frozen-lockfile)

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.x'

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || (echo "Retrying in 5s..." && sleep 5 && pnpm install --frozen-lockfile) || (echo "Retrying in 10s..." && sleep 10 && pnpm install --frozen-lockfile)

      - name: Run pnpm audit
        run: pnpm audit

  # Smoke test: verify the Docker image builds and starts successfully
  # Catches dependency resolution failures that only surface after npm prune (neverinfamous/db-mcp#149)
  docker-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: pr-smoke-test:latest
          cache-from: type=gha,scope=pr-smoke
          cache-to: type=gha,scope=pr-smoke,mode=max

      - name: Smoke test — server starts without crash
        run: |
          docker run -d --name pr-smoke -p 3000:3000 \
            -e ALLOWED_IO_ROOTS=/app/data \
            pr-smoke-test:latest \
            --transport http --port 3000 --server-host 0.0.0.0 --auth-token smoke-test-token
          sleep 5
          if ! docker ps --filter name=pr-smoke --format '{{.Status}}' | grep -q "Up"; then
            echo "❌ Docker smoke test failed — container crashed on startup"
            docker logs pr-smoke 2>&1 || true
            exit 1
          fi
          HTTP_STATUS=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/health || echo "000")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health endpoint returned $HTTP_STATUS"
            docker logs pr-smoke 2>&1 || true
            docker stop pr-smoke || true
            exit 1
          fi
          docker stop pr-smoke
          echo "✅ Docker smoke test passed"
