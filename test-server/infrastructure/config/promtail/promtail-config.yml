server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: mcp_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: memory_journal_mcp_logs
          __path__: /var/log/memory-journal-mcp/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            tool: tool
            category: category
            scope: scope
            status: status
            success: success
            durationMs: durationMs
            requestId: requestId
      - labels:
          tool:
          category:
          scope:
          status:
          success:
