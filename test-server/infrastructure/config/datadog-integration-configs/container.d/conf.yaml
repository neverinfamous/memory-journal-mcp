## All options defined here are available to all instances.
#
init_config:

## @param service - string - optional
## Attach the tag `service:<SERVICE>` to every metric, event, and service check emitted by this integration.
##
## Additionally, this sets the default `service` for every log source.
#
# service: <SERVICE>

## Every instance is scheduled independently of the others.
#
instances:

  ## @param tags - list of strings - optional
  ## A list of tags to attach to every metric and service check emitted by this instance.
  ##
  ## Learn more about tagging at https://docs.datadoghq.com/tagging
  #
  - tags:
      - env:development
      - source:wsl2

  ## @param service - string - optional
  ## Attach the tag `service:<SERVICE>` to every metric, event, and service check emitted by this integration.
  ##
  ## Defaults to the integration name
  #
    service: container

  ## @param min_collection_interval - number - optional - default: 15
  ## This changes the collection interval of the check. For more information, see:
  ## https://docs.datadoghq.com/developers/write_agent_check/#collection-interval
  #
    min_collection_interval: 15

  ## @param empty_default_hostname - boolean - optional - default: false
  ## This forces the check to send metrics with no hostname.
  ##
  ## This is useful for cluster-level checks.
  #
  # empty_default_hostname: false

  ## Container-specific configuration options

  ## @param collect_network_io_per_device - boolean - optional - default: false
  ## Collect network I/O metrics per network device instead of aggregating them.
  #
    collect_network_io_per_device: true

  ## @param collect_disk_io_per_device - boolean - optional - default: false  
  ## Collect disk I/O metrics per disk device instead of aggregating them.
  #
    collect_disk_io_per_device: true

  ## @param collect_memory_stats - boolean - optional - default: true
  ## Collect extended memory statistics including cache, swap, etc.
  #
    collect_memory_stats: true

  ## @param collect_cpu_stats - boolean - optional - default: true
  ## Collect CPU usage statistics per container.
  #
    collect_cpu_stats: true

  ## @param collect_network_stats - boolean - optional - default: true
  ## Collect network I/O statistics per container.
  #
    collect_network_stats: true

  ## @param collect_disk_stats - boolean - optional - default: true
  ## Collect disk I/O statistics per container.
  #
    collect_disk_stats: true

